<!DOCTYPE html>
<html lang="es">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Ranking de Jugadores</title>
   <style>
       body {
           font-family: Arial, sans-serif;
           /* Usamos la variable CSS que viene desde la etiqueta body de abajo */
           background-color: var(--bg-color); 
           text-align: center;
           margin: 0;
           padding: 40px 20px;
           transition: background-color 0.3s ease;
       }
       h1 {
           color: #333;
           font-size: 28px;
           margin-bottom: 20px;
       }
       .container {
           display: inline-block;
           background: white;
           padding: 30px;
           border-radius: 15px;
           box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.08);
           width: 100%;
           max-width: 450px;
           text-align: left;
       }
       .header-card {
           background-color: #455a64;
           color: white;
           text-align: center;
           padding: 12px;
           border-radius: 8px;
           font-weight: bold;
           font-size: 18px;
           margin-bottom: 15px;
       }
       ul {
           list-style: none;
           padding: 0;
           margin: 0;
       }
       li {
           display: flex;
           align-items: center;
           padding: 12px 5px;
           border-bottom: 1px solid #edf2f7;
           font-size: 16px;
           color: #2d3748;
       }
       li:last-child {
           border-bottom: none;
       }
       .badge {
           width: 28px;
           height: 28px;
           border-radius: 50%;
           display: flex;
           align-items: center;
           justify-content: center;
           font-weight: bold;
           font-size: 14px;
           margin-right: 15px;
           background-color: #cbd5e0;
           color: #4a5568;
       }
       /* Colores específicos de las burbujas numéricas según tu imagen */
       .rank-1 { background-color: #ffd700; color: #744210; }
       .rank-2 { background-color: #cbd5e0; color: #4a5568; }
       .rank-3 { background-color: #ed8936; color: #7b341e; }
       
       .name {
           font-weight: 600;
           flex-grow: 1;
       }
       .points {
           color: #718096;
           font-size: 14px;
           font-weight: bold;
       }
       .tag-leader {
           background-color: #fff3c4;
           color: #855d00;
           font-size: 11px;
           padding: 2px 6px;
           border-radius: 4px;
           margin-left: 8px;
           font-weight: bold;
           border: 1px solid #fbe380;
       }
       .footer-text {
           text-align: center;
           color: #a0aec0;
           font-size: 12px;
           margin-top: 25px;
       }
   </style>
</head>

<!-- Aquí inyectamos el color de Flask de forma segura sin alertar al validador CSS -->
<body style="--bg-color: {{ color or '#f4f4f4' }};">

   <h1>🏆 Ranking de Jugadores 🎮</h1>
   
   <div class="container">
       <div class="header-card">
           ⭐ Top Jugadores
       </div>
       <ul>
           {% for jugador in lista_jugadores %}
               <li>
                   <!-- Asignamos un color de burbuja especial a los 3 primeros puestos -->
                   <div class="badge {% if loop.index == 1 %}rank-1{% elif loop.index == 2 %}rank-2{% elif loop.index == 3 %}rank-3{% endif %}">
                       {{ loop.index }}
                   </div>
                   <div class="name">
                       {{ jugador.nombre }}
                       {% if loop.index == 1 %}
                           <span class="tag-leader">👑 Líder</span>
                       {% endif %}
                   </div>
                   <div class="points">{{ jugador.puntaje }} pts</div>
               </li>
           {% endfor %}
       </ul>
       
       <!-- Contador dinámico al fondo del recuadro -->
       <div class="footer-text">
           Total de jugadores: {{ lista_jugadores|length }}
       </div>
   </div>

</body>
</html>
